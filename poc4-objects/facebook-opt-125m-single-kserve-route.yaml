apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    serving.kserve.io/inference-pool-migrated: v1
  labels:
    app.kubernetes.io/component: llminferenceservice-router
    app.kubernetes.io/name: facebook-opt-125m-single
    app.kubernetes.io/part-of: llminferenceservice
  name: facebook-opt-125m-single-kserve-route
  namespace: llm-demo
  ownerReferences:
  - apiVersion: serving.kserve.io/v1alpha2
    blockOwnerDeletion: true
    controller: true
    kind: LLMInferenceService
    name: facebook-opt-125m-single
    uid: ea454eff-8da2-4748-88d2-b5007cc22df7
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: kserve-ingress-gateway
    namespace: kserve
  rules:
  # Rule 1: /v1/completions — via InferencePool (Scheduler/EPP)
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: facebook-opt-125m-single-inference-pool
      port: 8000
      weight: 80
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: my-llm-v2-inference-pool
      port: 8000
      weight: 20
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /v1/completions
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /llm-demo/facebook-opt-125m-single/v1/completions
    timeouts:
      backendRequest: 0s
      request: 0s
  # Rule 2: /v1/chat/completions — via InferencePool (Scheduler/EPP)
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: facebook-opt-125m-single-inference-pool
      port: 8000
      weight: 80
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: my-llm-v2-inference-pool
      port: 8000
      weight: 20
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /v1/chat/completions
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /llm-demo/facebook-opt-125m-single/v1/chat/completions
    timeouts:
      backendRequest: 0s
      request: 0s
  # Rule 3: /v1/responses — via InferencePool (Scheduler/EPP)
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: facebook-opt-125m-single-inference-pool
      port: 8000
      weight: 80
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: my-llm-v2-inference-pool
      port: 8000
      weight: 20
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /v1/responses
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /llm-demo/facebook-opt-125m-single/v1/responses
    timeouts:
      backendRequest: 0s
      request: 0s
  # Rule 4: catch-all — via Service (direct, no Scheduler)
  - backendRefs:
    - group: ""
      kind: Service
      name: facebook-opt-125m-single-kserve-workload-svc
      port: 8000
      weight: 80
    - group: ""
      kind: Service
      name: my-llm-v2-kserve-workload-svc
      port: 8000
      weight: 20
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /llm-demo/facebook-opt-125m-single
    timeouts:
      backendRequest: 0s
      request: 0s
